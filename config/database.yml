# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: <%= ENV.fetch("STOCK_DATABASE", "db/stock.sqlite3") %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: db/test.sqlite3

production:
  <<: *default
  # The public preview runs here and refuses to start unless STOCK_DATABASE is
  # the isolated tmp/ui-stock.sqlite3; hardcoding the path would let it serve
  # the computed database instead and quietly defeat that check.
  database: <%= ENV.fetch("STOCK_DATABASE", "db/stock.sqlite3") %>
