name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILS_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare test database
        run: bundle exec rails db:prepare

      - name: Check pending migrations
        run: bundle exec rails runner 'abort "Pending migrations" if ActiveRecord::Base.connection_pool.migration_context.needs_migration?'

      - name: Audit Ruby dependencies
        run: bundle exec bundler-audit check --update

      - name: Scan Rails application security
        run: bundle exec brakeman --no-pager --no-color --quiet

      - name: Run tests
        run: bundle exec rails test

      - name: Check generated schema and whitespace
        run: |
          git diff --exit-code -- db/schema.rb
          git diff --check
